# CNA simulation, baseline: perimeter VPN with client certificate + directory login, no MFA.
# Variant: MFA=totp docker compose --profile stub up -d --build   (adds a TOTP code to the login)
name: sim

x-node: &node
  build: ./image
  image: cna-sim-node
  cap_add: [NET_ADMIN]
  restart: "no"

networks:
  external-net:            # the internet side, where the clinician's device is
    ipam: {config: [{subnet: 172.20.0.0/24}]}
  dmz-net:                 # DMZ: gateway and the firewall behind it
    ipam: {config: [{subnet: 10.10.0.0/24}]}
  corp-net:                # corporate segment: workstation, directory
    ipam: {config: [{subnet: 10.20.0.0/24}]}
  clinical-net:            # restricted clinical segment: the LLM only
    ipam: {config: [{subnet: 10.30.0.0/24}]}
  llm-egress:              # rcp profile only: the LLM reaches EPFL RCP through here
    ipam: {config: [{subnet: 172.21.0.0/24}]}

volumes:
  pki-pub:
  pki-gw:
  pki-cli:
  pki-llm:
  pki-dir:

services:
  pki-init:
    <<: *node
    command: ["sh", "/roles/pki-init.sh"]
    volumes:
      - ./roles:/roles:ro
      - pki-pub:/pki/pub
      - pki-gw:/pki/gw
      - pki-cli:/pki/cli
      - pki-llm:/pki/llm
      - pki-dir:/pki/dir

  directory:
    <<: *node
    container_name: directory
    command: ["sh", "/roles/directory.sh"]
    depends_on: {pki-init: {condition: service_completed_successfully}}
    networks:
      corp-net: {ipv4_address: 10.20.0.5}
    volumes:
      - ./roles:/roles:ro
      - pki-pub:/pki/pub:ro
      - pki-dir:/pki/dir:ro

  vpn-gateway:
    <<: *node
    container_name: vpn-gateway
    command: ["sh", "/roles/vpn-gateway.sh"]
    depends_on:
      pki-init: {condition: service_completed_successfully}
      directory: {condition: service_started}
      dmz-fw: {condition: service_started}
    devices: ["/dev/net/tun:/dev/net/tun"]
    sysctls: {net.ipv4.ip_forward: "1"}
    environment: {MFA: "${MFA:-none}"}
    networks:
      external-net: {ipv4_address: 172.20.0.2}
      dmz-net: {ipv4_address: 10.10.0.2}
    volumes:
      - ./roles:/roles:ro
      - pki-pub:/pki/pub:ro
      - pki-gw:/pki/gw:ro

  dmz-fw:
    <<: *node
    container_name: dmz-fw
    command: ["sh", "/roles/dmz-fw.sh"]
    depends_on: {pki-init: {condition: service_completed_successfully}}
    sysctls: {net.ipv4.ip_forward: "1"}
    networks:
      dmz-net: {ipv4_address: 10.10.0.254}
      corp-net: {ipv4_address: 10.20.0.253}
    volumes: ["./roles:/roles:ro"]

  clinician:
    <<: *node
    container_name: clinician
    command: ["sh", "/roles/clinician.sh"]
    depends_on:
      pki-init: {condition: service_completed_successfully}
      vpn-gateway: {condition: service_started}
    devices: ["/dev/net/tun:/dev/net/tun"]
    environment: {MFA: "${MFA:-none}"}
    networks:
      external-net: {ipv4_address: 172.20.0.10}
    volumes:
      - ./roles:/roles:ro
      - pki-pub:/pki/pub:ro
      - pki-cli:/pki/cli:ro

  corp-ws:
    <<: *node
    container_name: corp-ws
    command: ["sh", "/roles/corp-ws.sh"]
    depends_on: {pki-init: {condition: service_completed_successfully}}
    networks:
      corp-net: {ipv4_address: 10.20.0.20}
    volumes:
      - ./roles:/roles:ro
      - pki-pub:/pki/pub:ro

  corp-fw:
    <<: *node
    container_name: corp-fw
    command: ["sh", "/roles/corp-fw.sh"]
    depends_on: {pki-init: {condition: service_completed_successfully}}
    sysctls: {net.ipv4.ip_forward: "1"}
    networks:
      corp-net: {ipv4_address: 10.20.0.254}
      clinical-net: {ipv4_address: 10.30.0.254}
    volumes: ["./roles:/roles:ro"]

  meditron-llm:
    <<: *node
    container_name: meditron-llm
    profiles: ["stub"]
    command: ["sh", "/roles/llm.sh"]
    depends_on: {pki-init: {condition: service_completed_successfully}}
    sysctls: {net.ipv4.ip_forward: "0"}
    environment:
      LLM_MODE: stub
      LLM_TLS: "${LLM_TLS:-on}"
      STUB_DELAY: "${STUB_DELAY:-0}"
      STUB_CONCURRENCY: "${STUB_CONCURRENCY:-1000000}"
    networks:
      clinical-net: {ipv4_address: 10.30.0.10}
    volumes:
      - ./roles:/roles:ro
      - ./llm:/llm:ro
      - pki-llm:/pki/llm:ro
      - pki-pub:/pki/pub:ro

  meditron-llm-rcp:
    <<: *node
    container_name: meditron-llm
    profiles: ["rcp"]
    command: ["sh", "/roles/llm.sh"]
    depends_on: {pki-init: {condition: service_completed_successfully}}
    sysctls: {net.ipv4.ip_forward: "0"}      # dual-homed, but must not route between its networks (H.TEC.13)
    env_file: [.env]
    environment:
      LLM_MODE: rcp
      LLM_TLS: "${LLM_TLS:-on}"
    networks:
      clinical-net: {ipv4_address: 10.30.0.10}
      llm-egress: {ipv4_address: 172.21.0.10}
    volumes:
      - ./roles:/roles:ro
      - ./llm:/llm:ro
      - pki-llm:/pki/llm:ro
      - pki-pub:/pki/pub:ro
